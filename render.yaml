services:
  - type: web
    name: tiktok-downloader-api
    runtime: python
    plan: free
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips "*" --limit-concurrency 50
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: ALLOWED_ORIGINS
        value: "*"            # change to your website, e.g. https://yoursite.com
      - key: MAX_CONCURRENT_DOWNLOADS
        value: "3"
